services:
  space-tracker:
    build: .
    container_name: space-tracker
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      # - NASA_API_KEY=your-key-here   # optional, falls back to the shared DEMO_KEY
    volumes:
      - ./nasa_cache:/app/nasa_cache
